name: fawry

networks:
  default:
    name: fawry_net

volumes:
  redis-data:
  pg-data:

services:
  redis:
    image: redis:7-alpine
    # volatile-lru: only keys with a TTL (user state, cache) can be evicted; the event stream never is
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fawry
      POSTGRES_PASSWORD: fawry
      POSTGRES_DB: fawry
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fawry -d fawry"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fawry_net
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8000:80"
      - "127.0.0.1:8080:8080"   # Traefik dashboard
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    image: fawry-api
    environment:
      REDIS_URL: redis://redis:6379/0
      MODELS_DIR: /app/models
      LIVE_DAY_MODE: dataset          # "dataset" (like the notebook) or "calendar"
    volumes: ["./models:/app/models:ro"]
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.api.rule=PathPrefix(`/recommendations`) || PathPrefix(`/events`) || Path(`/health`) || Path(`/ready`) || Path(`/model`) || Path(`/docs`) || Path(`/openapi.json`)"
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/ready
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
    restart: unless-stopped

  event-worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://fawry:fawry@postgres:5432/fawry
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  training:
    build: {context: ., dockerfile: Dockerfile.training}
    environment:
      DATABASE_URL: postgresql://fawry:fawry@postgres:5432/fawry
      MODELS_DIR: /app/models
      DATA_DIR: /app/data
      TZ: Africa/Cairo                # weekly run: Sunday 00:00 in this timezone
    volumes: ["./models:/app/models", "./data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  ui:
    build: {context: ., dockerfile: Dockerfile.ui}
    environment:
      API_BASE: http://traefik:80     # the UI talks to the API through the load balancer
    ports: ["7860:7860"]
    depends_on: [traefik]
    restart: unless-stopped

  autoscaler:
    build: {context: ., dockerfile: Dockerfile.autoscaler}
    environment:
      MIN_REPLICAS: "1"
      MAX_REPLICAS: "10"
      SCALE_UP_COOLDOWN: "30"
      SCALE_DOWN_COOLDOWN: "60"
      TARGET_RPS_PER_REPLICA: "40"    # placeholder - calibrate with the load test (see README)
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    ports: ["127.0.0.1:9100:9000"]    # /status (used by the load test)
    depends_on: [api]
    restart: unless-stopped
